<!DOCTYPE html>
<!-- Blog listing. content/blog.md provides the page; content/blog/*.md are the articles. -->
<html lang="en" translate="no">
 <head>
  <!-- @include partials/head.html robots="index, follow, max-image-preview:large, max-snippet:-1" -->
 </head>
 <body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- @include components/island/island.html home="Blog" -->

  <main id="main">
   <section class="section" aria-labelledby="page-title">
    <div class="container stack stack--lg">
     <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="/">Home</a></li><li aria-current="page">Blog</li></ol>
     </nav>
     <header class="stack" data-reveal>
      <span class="t-eyebrow">{{page.hero.kicker}}</span>
      <h1 class="t-h1" id="page-title">{{page.hero.line}}</h1>
      <p class="t-subheading">{{page.hero.lede}}</p>
     </header>
     <p class="t-body" data-reveal>{{page.intro}}</p>
     <ul class="related-links related-links--two" data-reveal-stagger>
      <!-- @each blog as item -->
      <li><a class="related-links__item card card--interactive" href="{{item.seo.path}}"><span class="t-eyebrow">{{item.topic}} · {{item.minutes}} min read</span><b>{{item.hero.line}}</b><span>{{item.hero.lede}}</span><span class="related-links__go">Read the post <span aria-hidden="true">&rarr;</span></span></a></li>
      <!-- @end -->
     </ul>
    </div>
   </section>
  </main>

  <!-- @include components/footer/footer.html tagline="AI, automation, websites and software from Dhaka — for Bangladesh, the US and Australia." -->
 </body>
</html>
