<!DOCTYPE html>
<!-- Blog article. content/blog/<slug>.md renders through this into /blog/<slug>/. -->
<html lang="en" translate="no">
 <head>
  <!-- @include partials/head.html robots="index, follow, max-image-preview:large, max-snippet:-1" -->
  <script type="application/ld+json">
   {
     "@context": "https://schema.org",
     "@graph": [{
       "@type": "BlogPosting",
       "@id": "{{site.url}}{{page.seo.path}}#post",
       "headline": "{{page.seo.title|json}}",
       "description": "{{page.seo.description|json}}",
       "datePublished": "{{page.date}}",
       "dateModified": "{{page.date}}",
       "author": { "@type": "Person", "@id": "{{site.url}}/#person", "name": "{{site.full-name}}", "url": "{{site.url}}/ruhan-islam/" },
       "publisher": { "@type": "Organization", "@id": "{{site.url}}/#service" },
       "image": "{{site.url}}{{page.og-image}}",
       "inLanguage": "en"
     }]
   }
  </script>
 </head>
 <body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- @include components/island/island.html home="Blog" -->

  <main id="main">
   <section class="section" aria-labelledby="page-title">
    <div class="container container--prose stack stack--lg">
     <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="/">Home</a></li><li><a href="/blog/">Blog</a></li><li aria-current="page">{{page.hero.line}}</li></ol>
     </nav>
     <header class="stack" data-reveal>
      <span class="t-eyebrow">{{page.hero.kicker}}</span>
      <h1 class="t-h1" id="page-title">{{page.hero.line}}</h1>
      <p class="t-subheading">{{page.hero.lede}}</p>
      <!-- @include components/byline/byline.html row="true" date="{{page.date|date}}" minutes="{{page.minutes}}" -->
     </header>
     <div class="prose" data-reveal>{{page.body}}</div>
     <!-- @include components/byline/byline.html card="true" -->

     <!-- @if page.more -->
     <nav class="stack" aria-labelledby="more-title">
      <h2 class="t-h3" id="more-title">More from the blog</h2>
      <ul class="related-links" data-reveal-stagger>
       <!-- @each page.more as m -->
       <li><a class="related-links__item card card--interactive" href="{{m.path}}"><b>{{m.name}}</b><span>{{m.line}}</span><span class="related-links__go">Read <span aria-hidden="true">&rarr;</span></span></a></li>
       <!-- @end -->
      </ul>
     </nav>
     <!-- @end -->
    </div>
   </section>
  </main>

  <!-- @include components/footer/footer.html tagline="AI, automation, websites and software from Dhaka — for Bangladesh, the US and Australia." -->
 </body>
</html>
