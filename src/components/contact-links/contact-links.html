<ul class="contact-links contact-links--{{props.variant}}" aria-label="Contact">
  <li>
    <a class="contact-links__item" href="mailto:{{site.email}}">
      <span class="contact-links__icon contact-links__icon--email" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="contact-links__text"><span class="contact-links__label">Email</span><span class="contact-links__value">{{site.email}}</span></span>
    </a>
  </li>
  <li>
    <a class="contact-links__item" href="{{site.whatsapp-link}}" rel="noopener" target="_blank">
      <span class="contact-links__icon contact-links__icon--whatsapp" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5Zm0 1.9a7.6 7.6 0 1 1-3.9 14.1l-.3-.2-2.8.8.8-2.7-.2-.3A7.6 7.6 0 0 1 12 4.4Z"/><path fill="currentColor" d="M9.1 7.4c.2 0 .4 0 .5.4l.7 1.7c.1.2 0 .4-.1.6l-.5.6c-.1.1-.2.3 0 .5.4.7 1 1.4 1.6 1.9.7.6 1.3.9 1.6 1 .2.1.4.1.5-.1l.6-.8c.2-.2.4-.2.6-.1l1.7.8c.2.1.4.2.4.4 0 .4-.1 1-.6 1.4-.5.5-1.3.7-2 .6-1-.2-2.3-.7-3.6-1.9-1.5-1.3-2.4-2.9-2.6-3.6-.3-.9 0-1.8.5-2.4.3-.3.6-.4.7-.4Z"/></svg>
      </span>
      <span class="contact-links__text"><span class="contact-links__label">WhatsApp</span><span class="contact-links__value">{{site.whatsapp-display}}</span></span>
    </a>
  </li>
  <li>
    <a class="contact-links__item" href="{{site.linkedin}}" rel="noopener me" target="_blank">
      <span class="contact-links__icon contact-links__icon--linkedin" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="6.2" cy="6.4" r="1.9" fill="currentColor"/><rect x="4.5" y="9.3" width="3.4" height="10.2" rx=".6" fill="currentColor"/><path fill="currentColor" d="M10.3 9.3h3.2v1.5c.6-1 1.8-1.8 3.4-1.8 2.6 0 3.6 1.7 3.6 4.4v6.1h-3.4v-5.4c0-1.3-.4-2.1-1.6-2.1-1.3 0-1.8.9-1.8 2.1v5.4h-3.4Z"/></svg>
      </span>
      <span class="contact-links__text"><span class="contact-links__label">LinkedIn</span><span class="contact-links__value">Ruhan</span></span>
    </a>
  </li>
</ul>
