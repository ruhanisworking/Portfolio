<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{page.seo.title}}</title>
<meta name="description" content="{{page.seo.description}}" />
<meta name="author" content="{{site.full-name}}" />
<meta name="robots" content="{{props.robots}}" />
<link rel="canonical" href="{{site.url}}{{page.seo.path}}" />
<meta name="theme-color" content="{{colors.canvas}}" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{site.name}}" />
<meta property="og:locale" content="en_US" />
<meta property="og:url" content="{{site.url}}{{page.seo.path}}" />
<meta property="og:title" content="{{page.seo.og-title}}" />
<meta property="og:description" content="{{page.seo.description}}" />
<meta property="og:image" content="{{site.url}}{{page.og-image}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{page.seo.og-image-alt}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{page.seo.og-title}}" />
<meta name="twitter:description" content="{{page.seo.description}}" />
<meta name="twitter:image" content="{{site.url}}{{page.og-image}}" />

<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="{{fonts.google-href}}" />
<link rel="stylesheet" href="/css/site.css" />
<!-- marks that JS runs, so [data-reveal] content may start hidden -->
<script>document.documentElement.classList.add("js");</script>
<script src="/js/site.js" defer></script>
