name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          if [ -f favicon.svg ]; then cp favicon.svg _site/; fi
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
