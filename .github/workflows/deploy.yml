name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The site is built from src/ + content/ + DESIGN.md into dist/ (no
      # dependencies to install). check.mjs fails the deploy on any design
      # token or SEO rule violation, so a broken page never goes live.
      - name: Build and check
        run: |
          node tools/build.mjs
          node tools/check.mjs
          if [ -f CNAME ]; then cp CNAME dist/; fi

      # Cache-busting. Browsers cache css/js/favicons; stamping the commit SHA
      # onto those URLs makes every deploy a new URL, so returning visitors
      # get the new site instead of a stale copy.
      - name: Stamp asset URLs with the commit SHA
        run: |
          VER="${GITHUB_SHA:0:8}"
          find dist -name '*.html' -print0 | xargs -0 sed -i \
            -e "s|href=\"/css/site.css\"|href=\"/css/site.css?v=$VER\"|g" \
            -e "s|src=\"/js/site.js\"|src=\"/js/site.js?v=$VER\"|g" \
            -e "s|href=\"/favicon.svg\"|href=\"/favicon.svg?v=$VER\"|g" \
            -e "s|href=\"/favicon-\([0-9]\+\)\.png\"|href=\"/favicon-\1.png?v=$VER\"|g"
          echo "stamped with v=$VER"
          grep -c "v=$VER" dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
